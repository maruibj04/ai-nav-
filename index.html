<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #43b54e;
  --green-hover: #3aa344;
  --green-light: #e8f7e9;
  --sidebar-w: 64px;
  --sidebar-bg: #1a1f2e;
  --sidebar-active: #43b54e;
  --bg: #f0f2f0;
  --card-bg: #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: #555;
  --text-hint: #aaa;
  --border: #e8ebe8;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 4px;
  flex-shrink: 0;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 50;
}

.sidebar-logo {
  width: 36px;
  height: 36px;
  background: var(--green);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  flex-shrink: 0;
}

.sidebar-logo svg {
  width: 20px; height: 20px;
  fill: white;
}

.sidebar-item {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  color: #666;
  gap: 2px;
  position: relative;
}

.sidebar-item svg {
  width: 20px; height: 20px;
}

.sidebar-item:hover {
  background: rgba(255,255,255,0.08);
  color: #ccc;
}

.sidebar-item.active {
  background: rgba(67,181,78,0.15);
  color: var(--green);
}

.sidebar-item .badge {
  font-size: 9px;
  font-weight: 700;
  color: inherit;
  letter-spacing: 0;
  line-height: 1;
}

.sidebar-divider {
  width: 32px;
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 6px 0;
}

/* Main */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  overflow-y: auto;
  height: 100vh;
}

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  background: rgba(240,242,240,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 40;
}

.topbar-title {
  font-size: 19.5px;
  font-weight: 700;
  color: var(--text-primary);
}

.topbar-sub {
  font-size: 15.6px;
  color: var(--text-hint);
  margin-left: 8px;
  font-weight: 400;
}

/* Content */
.content {
  padding: 28px 32px 60px;
}

/* Section */
.section {
  margin-bottom: 40px;
  scroll-margin-top: 72px;
}

.section-title {
  font-size: 17px;
  font-weight: 500;
  color: #555;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

/* Card */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  align-items: center;
  gap: 14px;
  user-select: none;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--green);
  transform: scaleY(0);
  transition: transform 0.18s ease;
  border-radius: 0 2px 2px 0;
}

.card:hover {
  border-color: #c8dfc8;
  box-shadow: 0 4px 20px rgba(67,181,78,0.1);
  transform: translateY(-1px);
}

.card:hover::before {
  transform: scaleY(1);
}

.card:active {
  transform: translateY(0);
  box-shadow: none;
}

.card-logo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
}

.card-body {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-desc {
  font-size: 12px;
  color: var(--text-hint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-arrow {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  color: #d0d0d0;
  transition: color 0.15s, transform 0.15s;
}

.card:hover .card-arrow {
  color: var(--green);
  transform: translateX(2px);
}

.card-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 600;
  vertical-align: middle;
  margin-left: 6px;
  flex-shrink: 0;
}

.tag-local { background: #fff0e0; color: #d4660a; }
.tag-internal { background: var(--green-light); color: #2a7a30; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,14,26,0.45);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
}
.modal-overlay.open { display: flex; }

.modal {
  background: #fff;
  border-radius: 20px;
  padding: 32px;
  width: 340px;
  max-width: calc(100vw - 32px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.18);
  animation: popUp 0.2s cubic-bezier(0.34,1.4,0.64,1);
  position: relative;
}

@keyframes popUp {
  from { transform: scale(0.9) translateY(8px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: #f0f0f0;
  border: none;
  cursor: pointer;
  font-size: 14px;
  color: #888;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: #e5e5e5; }

.modal-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.modal-icon {
  width: 50px; height: 50px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}

.modal-title { font-size: 17px; font-weight: 700; }
.modal-subtitle { font-size: 12px; color: var(--text-hint); margin-top: 2px; }

.modal-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 22px;
  padding: 12px 14px;
  background: #f8f8f8;
  border-radius: 10px;
}

.modal-btns { display: flex; flex-direction: column; gap: 8px; }

.btn {
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  width: 100%;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-hover); }
.btn-secondary { background: #f4f4f4; color: var(--text-secondary); }
.btn-secondary:hover { background: #ebebeb; }

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(20,20,20,0.9);
  color: #fff;
  padding: 9px 20px;
  border-radius: 100px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  z-index: 2000;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 640px) {
  .topbar { padding: 0 16px; }
  .content { padding: 20px 14px 40px; }
  .grid { grid-template-columns: 1fr; gap: 8px; }
  .card { padding: 14px 14px; }
}
</style>
</head>

const CATS = ["内部文档", "设计师平台", "AI 助手", "其他"];

function isInternal(url) {
  return url && (url.includes('zhenguanyu.com') || url.includes('moxt.ai'));
}

function render() {
  const content = document.getElementById('content');
  CATS.forEach(cat => {
    const items = TOOLS.filter(t => t.cat === cat);
    if (!items.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-' + cat;

    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.textContent = cat;
    sec.appendChild(titleEl);

    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(tool => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => handleClick(tool);

      let tag = '';
      if (tool.type === 'local' || tool.type === 'scheme') {
        tag = '<span class="card-tag tag-local">本地</span>';
      } else if (isInternal(tool.url)) {
        tag = '<span class="card-tag tag-internal">内部</span>';
      }

      card.innerHTML = `
        <img class="card-logo" src="${tool.logo}" alt="${tool.name}">
        <div class="card-body">
          <div class="card-name" style="display:flex;align-items:center;">${tool.name}${tag}</div>
          <div class="card-desc">${tool.desc}</div>
        </div>
        <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      `;
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    content.appendChild(sec);
  });
}

function handleClick(tool) {
  if (tool.type === 'web') {
    window.open(tool.url, '_blank');
    return;
  }
  if (tool.type === 'scheme') {
    if (localStorage.getItem('app_' + tool.name) === '1') {
      launchScheme(tool.scheme, tool.url, tool.name);
    } else {
      showModal(tool);
    }
    return;
  }
  if (tool.type === 'local') {
    window.open(tool.url, '_blank');
    return;
  }
}

function launchScheme(scheme, fallback, name) {
  let gone = false;
  const onBlur = () => { gone = true; };
  window.addEventListener('blur', onBlur, { once: true });
  const a = document.createElement('a');
  a.href = scheme; a.click();
  setTimeout(() => {
    window.removeEventListener('blur', onBlur);
    if (!gone) {
      showToast('未检测到 ' + name + '，已跳转至下载页');
      window.open(fallback, '_blank');
    }
  }, 2000);
}

function showModal(tool) {
  document.getElementById('m-icon').src = tool.logo;
  document.getElementById('m-title').textContent = tool.name;
  document.getElementById('m-sub').textContent = tool.desc;
  document.getElementById('m-desc').textContent = '你已在本机安装 ' + tool.name + ' 了吗？已安装可直接打开，未安装请前往下载。';

  const btns = document.getElementById('m-btns');
  btns.innerHTML = '';

  const b1 = document.createElement('button');
  b1.className = 'btn btn-primary';
  b1.innerHTML = '✓ 已安装，直接打开';
  b1.onclick = () => {
    localStorage.setItem('app_' + tool.name, '1');
    closeModal();
    launchScheme(tool.scheme, tool.url, tool.name);
  };

  const b2 = document.createElement('button');
  b2.className = 'btn btn-secondary';
  b2.innerHTML = '↓ 前往下载';
  b2.onclick = () => { closeModal(); window.open(tool.url, '_blank'); };

  btns.appendChild(b1);
  btns.appendChild(b2);
  document.getElementById('modal').classList.add('open');
}

function handleOverlay(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function scrollToSection(cat) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + cat).classList.add('active');
  const sec = document.getElementById('sec-' + cat);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Highlight active section on scroll
const main = document.querySelector('.main');
main.addEventListener('scroll', () => {
  const sections = CATS.map(c => document.getElementById('sec-' + c)).filter(Boolean);
  let current = CATS[0];
  for (const sec of sections) {
    if (sec.getBoundingClientRect().top <= 80) current = sec.id.replace('sec-', '');
  }
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const active = document.getElementById('nav-' + current);
  if (active) active.classList.add('active');
});

render();
</script>
</body>
</html>
